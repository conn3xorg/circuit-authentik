name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Logs in with the bootstrap token and the password, makes OIDC and SAML
      # providers, gets a token from the first and metadata from the second,
      # and checks an ordinary user is refused. Then restarts both services
      # and does it all again, which needs PostgreSQL and the secret key intact.
      - name: Check logins, providers, and a restart
        working-directory: examples/local
        run: |
          check() { sudo podman exec -i circuit-authentik podman exec -i -e AK_TOKEN=example-token-not-secret -e AK_PASSWORD=tracing-paper-kite authentik-server python3 - < check.py; }
          check
          sudo podman exec circuit-authentik systemctl restart authentik-worker authentik-server
          for _ in $(seq 24); do check && break; sleep 5; done
          check
      - name: Check that no secret reached state
        working-directory: examples/local
        run: |
          key=$(sudo podman exec circuit-authentik sed -n 's/^AUTHENTIK_SECRET_KEY=//p' /etc/authentik/keys.env)
          test -n "$key"
          for s in "$key" correct-horse-battery tracing-paper-kite example-token-not-secret; do
            ! grep -qF "$s" terraform.tfstate
          done
      - name: Check only root can enter the data's parent
        run: |
          [ "$(sudo podman exec circuit-authentik stat -c '%u %a' /var/lib/authentik)" = "0 700" ]
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
